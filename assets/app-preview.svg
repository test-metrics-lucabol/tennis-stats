<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Tennis Pivot Tracker preview placeholder</title>
  <desc id="desc">A playful mock preview for the Tennis Pivot Tracker README while a real app screenshot is pending.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b4332"/>
      <stop offset=".48" stop-color="#2d6a4f"/>
      <stop offset="1" stop-color="#1d3557"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#00150c" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="1200" height="630" rx="38" fill="url(#bg)"/>
  <circle cx="1020" cy="105" r="95" fill="#b7e000" opacity=".2"/>
  <circle cx="1060" cy="505" r="155" fill="#52b788" opacity=".16"/>
  <path d="M88 500c175-48 320-28 465 58 158 94 346 75 555-57" fill="none" stroke="#fff" stroke-opacity=".13" stroke-width="18" stroke-linecap="round"/>

  <g transform="translate(80 76)">
    <circle cx="48" cy="48" r="43" fill="#b7e000"/>
    <path d="M23 20c16 14 23 31 18 57M73 20c-16 14-23 31-18 57" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
    <text x="118" y="42" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="800">Tennis Pivot Tracker</text>
    <text x="122" y="82" fill="#d8f3dc" font-family="Segoe UI, Arial, sans-serif" font-size="25">Chart less noise. Find the point that mattered.</text>
  </g>

  <g transform="translate(790 92)">
    <rect width="250" height="52" rx="26" fill="#fff" opacity=".16"/>
    <text x="29" y="34" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Real screenshot soon</text>
  </g>

  <g transform="translate(116 177)" filter="url(#shadow)">
    <rect width="420" height="372" rx="32" fill="#f0f2f5"/>
    <rect width="420" height="72" rx="32" fill="#fff"/>
    <text x="30" y="45" fill="#2d6a4f" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="800">Record</text>
    <text x="312" y="45" fill="#6c757d" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">Set 1</text>

    <rect x="30" y="100" width="360" height="84" rx="18" fill="#1d3557"/>
    <text x="58" y="135" fill="#cfe8ff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Player vs Opponent</text>
    <text x="58" y="169" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="900">4 - 3</text>
    <text x="316" y="155" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">40-30</text>

    <rect x="30" y="212" width="168" height="52" rx="14" fill="#2d6a4f"/>
    <text x="58" y="245" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800">Took control</text>
    <rect x="222" y="212" width="168" height="52" rx="14" fill="#c1121f"/>
    <text x="267" y="245" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800">Leak</text>

    <rect x="30" y="288" width="100" height="44" rx="12" fill="#fff" stroke="#dde0e6"/>
    <text x="53" y="316" fill="#1d3557" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="800">Serve</text>
    <rect x="150" y="288" width="112" height="44" rx="12" fill="#fff" stroke="#dde0e6"/>
    <text x="174" y="316" fill="#1d3557" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="800">Return</text>
    <rect x="282" y="288" width="108" height="44" rx="12" fill="#e07b00"/>
    <text x="314" y="316" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="800">Depth</text>
  </g>

  <g transform="translate(592 177)" filter="url(#shadow)">
    <rect width="492" height="372" rx="32" fill="#fff"/>
    <text x="32" y="52" fill="#1a1a2e" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="900">Post-match gold</text>
    <text x="34" y="88" fill="#6c757d" font-family="Segoe UI, Arial, sans-serif" font-size="20">Skip the noise. Coach the pattern.</text>

    <g transform="translate(32 124)">
      <rect width="128" height="96" rx="20" fill="#e8f5ee"/>
      <text x="22" y="40" fill="#2d6a4f" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">Big pts</text>
      <text x="28" y="78" fill="#1b4332" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="900">7/10</text>
    </g>
    <g transform="translate(184 124)">
      <rect width="128" height="96" rx="20" fill="#edf4fb"/>
      <text x="22" y="40" fill="#1d3557" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">Top leak</text>
      <text x="24" y="78" fill="#1d3557" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="900">BH</text>
    </g>
    <g transform="translate(336 124)">
      <rect width="124" height="96" rx="20" fill="#fff2df"/>
      <text x="18" y="40" fill="#e07b00" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">Pressure</text>
      <text x="23" y="78" fill="#7a4a00" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="900">62%</text>
    </g>

    <rect x="32" y="252" width="428" height="62" rx="18" fill="#1b4332"/>
    <text x="58" y="291" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">One pattern: short returns under pressure</text>
    <rect x="32" y="324" width="428" height="8" rx="4" fill="#dde0e6"/>
    <rect x="32" y="324" width="290" height="8" rx="4" fill="#52b788"/>
  </g>
</svg>
